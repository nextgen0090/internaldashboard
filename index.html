<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Vault 2.0 — Internal Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: rgba(35, 47, 62, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eef5;
      --muted: #9aa7b8;
      --accent: #42a5f5;
      --ok: #4caf50;
      --warn: #ff9800;
      --err: #f44336;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% 35%, rgba(66, 165, 245, 0.12), transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 80%, rgba(156, 39, 176, 0.08), transparent 55%),
        var(--bg);
    }

    .wrap {
      width: min(1920px, 98vw);
      max-width: 1920px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      margin-bottom: 1rem;
    }

    .card h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .row-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
    }

    .section-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .section-nav a {
      color: #7ec8ff;
      font-size: 0.82rem;
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
    }

    .section-nav a:hover {
      background: rgba(66, 165, 245, 0.12);
    }

    .toolbar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: end;
    }

    .field { flex: 1; min-width: 240px; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 20, 25, 0.65);
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #1976d2, #42a5f5);
      color: #fff;
      white-space: nowrap;
    }

    button.secondary,
    a.btn-link {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    a.btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    a.btn-link:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .refresh-timer {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
      color: #b3d9ff;
      font-variant-numeric: tabular-nums;
    }

    .refresh-timer strong {
      color: var(--text);
      min-width: 1.5rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      border: 1px solid rgba(76, 175, 80, 0.35);
      background: rgba(20, 45, 30, 0.95);
      color: #b9f6ca;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.ok { background: var(--ok); box-shadow: 0 0 6px 1px rgba(76, 175, 80, 0.5); }
    .dot.err { background: var(--err); box-shadow: 0 0 6px 1px rgba(244, 67, 54, 0.4); }
    .dot.busy { background: var(--warn); }

    .error {
      color: #ffb4ab;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      white-space: pre-wrap;
    }

    .hidden { display: none !important; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .kpi {
      background: rgba(15, 20, 25, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }

    .kpi-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .kpi-value {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .kpi-sub {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .section-grid .card {
      min-width: 0;
    }

    @media (max-width: 1200px) {
      .section-grid {
        grid-template-columns: 1fr;
      }
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th, td {
      text-align: left;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
      background: rgba(35, 47, 62, 0.98);
    }

    .table-wrap {
      overflow-y: auto;
      overflow-x: hidden;
      max-height: 420px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .table-wrap.tall {
      max-height: min(70vh, 720px);
      min-height: 320px;
    }

    .rtp-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.25rem;
      min-width: 0;
    }

    .rtp-bar-wrap > span {
      font-size: 0.78rem;
    }

    .rtp-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .rtp-bar > span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1976d2, #42a5f5);
    }

    .rtp-bar.over > span { background: linear-gradient(90deg, #e65100, #ff9800); }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.ok { background: rgba(76, 175, 80, 0.15); color: #81c784; }
    .badge.warn { background: rgba(255, 152, 0, 0.15); color: #ffb74d; }
    .badge.muted { background: rgba(255, 255, 255, 0.06); color: var(--muted); }
    .badge.rating-low { background: rgba(244, 67, 54, 0.15); color: #ef9a9a; }
    .badge.rating-mid { background: rgba(255, 152, 0, 0.15); color: #ffb74d; }
    .badge.rating-high { background: rgba(76, 175, 80, 0.15); color: #81c784; }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    pre.json-view {
      margin: 0;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 20, 25, 0.65);
      overflow: auto;
      max-height: 480px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #b3d9ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Game Vault 2.0 — Internal Dashboard</h1>
        <p class="subtitle">Loads data from <code style="color:#b3d9ff">/api/dashboard/internal/summary</code></p>
        <div class="status-row">
          <div class="status">
            <span class="dot" id="connDot"></span>
            <span id="connText">Not loaded</span>
          </div>
          <div class="refresh-timer" id="refreshTimer">Next refresh in <strong id="refreshSeconds">15</strong>s</div>
        </div>
      </div>
      <div class="toolbar" style="flex:1; max-width:560px;">
        <div class="field">
          <label for="baseUrl">Base URL — leave empty; double-click <code style="color:#b3d9ff">start.bat</code> (not python -m http.server)</label>
          <input id="baseUrl" value="" placeholder="empty = auto via start.bat on :8080" />
        </div>
        <button id="loadBtn" type="button">Load</button>
        <button class="secondary" id="toggleJsonBtn" type="button">Show JSON</button>
        <a class="btn-link secondary" href="https://gamevault222.com/api/devops" target="_blank" rel="noopener noreferrer">Health Monitor</a>
      </div>
    </header>

    <div class="toast hidden" id="loadToast"></div>

    <div class="error hidden" id="fetchError"></div>

    <section id="dashboard" class="hidden">
      <div class="kpi-grid" id="kpiGrid"></div>

      <nav class="section-nav" id="sectionNav"></nav>

      <div class="section-grid">
        <section class="card" id="sec-rtp-game">
          <h2>RTP by Game <span class="row-count" id="countRtpGame"></span></h2>
          <div class="table-wrap" id="rtpByGameWrap"></div>
        </section>
        <section class="card" id="sec-rtp-user">
          <h2>RTP by User <span class="row-count" id="countRtpUser"></span></h2>
          <div class="table-wrap" id="rtpByUserWrap"></div>
        </section>
        <section class="card" id="sec-above-target">
          <h2>Games Above Target RTP <span class="row-count" id="countAboveTarget"></span></h2>
          <div class="table-wrap" id="gamesAboveTargetWrap"></div>
        </section>
        <section class="card" id="sec-users-high">
          <h2>Users RTP &ge; 100% <span class="row-count" id="countUsersHigh"></span></h2>
          <div class="table-wrap" id="usersRtpHighWrap"></div>
        </section>
        <section class="card" style="grid-column: 1 / -1;" id="sec-feedbacks">
          <h2>User Feedbacks <span class="row-count" id="countFeedbacks"></span></h2>
          <div class="table-wrap tall" id="userFeedbacksWrap"></div>
        </section>
        <section class="card" style="grid-column: 1 / -1;" id="sec-target-rtp">
          <h2>Game Target RTP <span class="row-count" id="countTargetRtp"></span></h2>
          <div class="table-wrap tall" id="gamesTargetRtpWrap"></div>
        </section>
      </div>

      <section class="card hidden" id="jsonCard">
        <h2>Raw JSON</h2>
        <pre class="json-view" id="jsonView"></pre>
      </section>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let lastResponse = null;

    function apiOrigin() {
      const base = $('baseUrl').value.trim().replace(/\/$/, '');
      return base || window.location.origin;
    }

    function show(el, visible) {
      el.classList.toggle('hidden', !visible);
    }

    function setConn(state, text) {
      $('connDot').className = 'dot ' + (state || '');
      $('connText').textContent = text;
    }

    function fmtMoney(n) {
      return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtRtp(n) {
      return (Number(n || 0) * 100).toFixed(2) + '%';
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 6 });
    }

    function fmtInt(n) {
      return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function ratingBadge(rating) {
      const r = Number(rating || 0);
      let cls = 'rating-mid';
      if (r <= 2) cls = 'rating-low';
      else if (r >= 4) cls = 'rating-high';
      return '<span class="badge ' + cls + '">' + r.toFixed(1) + ' / 5</span>';
    }

    function rtpBar(rtp, targetRtp) {
      const val = Number(rtp || 0);
      const pct = Math.min(val * 100, 100);
      const over = targetRtp != null && val >= Number(targetRtp);
      return '<div class="rtp-bar-wrap"><div class="rtp-bar' + (over ? ' over' : '') + '"><span style="width:' + pct + '%"></span></div><span>' + fmtRtp(val) + '</span></div>';
    }

    function setRowCount(id, rows) {
      const el = $(id);
      if (!el) return;
      const n = Array.isArray(rows) ? rows.length : 0;
      el.textContent = n + ' row' + (n === 1 ? '' : 's');
    }

    function renderSectionNav(sections) {
      $('sectionNav').innerHTML = sections.map((s) =>
        '<a href="#' + s.id + '">' + s.label + ' (' + s.count + ')</a>'
      ).join('');
    }

    function renderTable(containerId, rows, columns) {
      const el = $(containerId);
      if (!Array.isArray(rows) || rows.length === 0) {
        el.innerHTML = '<div class="empty">No data.</div>';
        return;
      }

      const head = '<tr>' + columns.map((c) => '<th>' + c.label + '</th>').join('') + '</tr>';
      const body = rows.map((row) =>
        '<tr>' + columns.map((c) => '<td>' + (c.render ? c.render(row) : (row[c.key] ?? '')) + '</td>').join('') + '</tr>'
      ).join('');

      el.innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }

    function renderDashboard(data) {
      const d = data?.data || {};
      const feedbacks = d.userFeedbacks || [];
      const totalFeedbackCount = feedbacks.reduce((s, r) => s + Number(r.feedBackCount || 0), 0);
      const avgFeedbackRating = feedbacks.length
        ? feedbacks.reduce((s, r) => s + Number(r.avgRating || 0), 0) / feedbacks.length
        : 0;

      $('kpiGrid').innerHTML = [
        { label: 'Total Recharged', value: '$' + fmtMoney(d.totalRecharged) },
        { label: 'Total Redeemed', value: '$' + fmtMoney(d.totalRedeemed) },
        { label: 'Game Users', value: fmtInt(d.totalGameUsers) },
        {
          label: 'Whole Game RTP',
          value: fmtRtp(d.wholeGameRtp?.rtp),
          sub: 'Bet $' + fmtMoney(d.wholeGameRtp?.totalBet) + ' · Win $' + fmtMoney(d.wholeGameRtp?.totalWin),
        },
        {
          label: 'User Feedbacks',
          value: fmtInt(totalFeedbackCount),
          sub: feedbacks.length ? 'Avg rating ' + avgFeedbackRating.toFixed(1) + ' · ' + feedbacks.length + ' users' : 'No feedback yet',
        },
      ].map((k) =>
        '<div class="kpi"><div class="kpi-label">' + k.label + '</div><div class="kpi-value">' + k.value + '</div>' +
        (k.sub ? '<div class="kpi-sub">' + k.sub + '</div>' : '') + '</div>'
      ).join('');

      const gameRtpCols = [
        { label: 'Game', key: 'gameName' },
        { label: 'Total Bet', render: (r) => '$' + fmtMoney(r.totalBet) },
        { label: 'Total Win', render: (r) => '$' + fmtMoney(r.totalWin) },
        { label: 'Spins', render: (r) => fmtInt(r.totalSpin) },
        { label: 'RTP', render: (r) => rtpBar(r.rtp, r.targetRtp) },
        { label: 'Target', render: (r) => '<span class="badge muted">' + fmtRtp(r.targetRtp) + '</span>' },
        {
          label: 'Status',
          render: (r) => Number(r.rtp) >= Number(r.targetRtp)
            ? '<span class="badge warn">Above target</span>'
            : '<span class="badge ok">Below target</span>',
        },
      ];

      const userRtpCols = [
        { label: 'Username', key: 'username' },
        { label: 'Total Bet', render: (r) => '$' + fmtMoney(r.totalBet) },
        { label: 'Total Win', render: (r) => '$' + fmtMoney(r.totalWin) },
        { label: 'Spins', render: (r) => fmtInt(r.totalSpin) },
        { label: 'RTP', render: (r) => rtpBar(r.rtp, 1) },
      ];

      renderTable('rtpByGameWrap', d.rtpByGame, gameRtpCols);
      renderTable('rtpByUserWrap', d.rtpByUser, userRtpCols);
      renderTable('gamesAboveTargetWrap', d.gamesAboveTargetRtp, gameRtpCols);
      renderTable('usersRtpHighWrap', d.usersRtpAboveOrEqualOne, userRtpCols);
      renderTable('gamesTargetRtpWrap', d.gamesTargetRtp, [
        { label: 'Game', key: 'gameName' },
        { label: 'Target RTP', render: (r) => fmtRtp(r.targetRtp) },
      ]);
      renderTable('userFeedbacksWrap', feedbacks, [
        { label: 'User ID', render: (r) => '<span title="' + (r.userId || '') + '">' + (r.userId || '') + '</span>' },
        { label: 'Feedback Count', render: (r) => fmtInt(r.feedBackCount) },
        { label: 'Avg Rating', render: (r) => ratingBadge(r.avgRating) },
      ]);

      setRowCount('countRtpGame', d.rtpByGame);
      setRowCount('countRtpUser', d.rtpByUser);
      setRowCount('countAboveTarget', d.gamesAboveTargetRtp);
      setRowCount('countUsersHigh', d.usersRtpAboveOrEqualOne);
      setRowCount('countFeedbacks', feedbacks);
      setRowCount('countTargetRtp', d.gamesTargetRtp);

      renderSectionNav([
        { id: 'sec-rtp-game', label: 'RTP by Game', count: (d.rtpByGame || []).length },
        { id: 'sec-rtp-user', label: 'RTP by User', count: (d.rtpByUser || []).length },
        { id: 'sec-above-target', label: 'Above Target', count: (d.gamesAboveTargetRtp || []).length },
        { id: 'sec-users-high', label: 'Users RTP ≥100%', count: (d.usersRtpAboveOrEqualOne || []).length },
        { id: 'sec-feedbacks', label: 'User Feedbacks', count: feedbacks.length },
        { id: 'sec-target-rtp', label: 'Game Target RTP', count: (d.gamesTargetRtp || []).length },
      ]);

      $('jsonView').textContent = JSON.stringify(lastResponse, null, 2);
      show($('dashboard'), true);
    }

    function setError(message) {
      const el = $('fetchError');
      if (!message) { el.textContent = ''; show(el, false); return; }
      el.textContent = message;
      show(el, true);
    }

    function isStaticServer404(text) {
      return /Error code:\s*404/i.test(text) && /File not found/i.test(text);
    }

    function parseSummaryResponse(res, text) {
      let json;
      try { json = text ? JSON.parse(text) : null; } catch {
        if (isStaticServer404(text)) {
          throw new Error('STATIC_404');
        }
        throw new Error('Response is not valid JSON.\n' + text.slice(0, 300));
      }
      if (!res.ok) throw new Error(json?.message || ('HTTP ' + res.status));
      if (!json?.success) throw new Error(json?.message || 'API returned success: false');
      return json;
    }

    async function fetchSummaryFrom(origin) {
      const url = origin.replace(/\/$/, '') + '/api/dashboard/internal/summary';
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      const text = await res.text();
      return { json: parseSummaryResponse(res, text), url, origin };
    }

    const REFRESH_SEC = 15;
    let secondsLeft = REFRESH_SEC;
    let isLoading = false;
    let toastTimer = null;

    function updateRefreshTimer() {
      const el = $('refreshTimer');
      const sec = $('refreshSeconds');
      if (isLoading) {
        el.innerHTML = 'Reloading data…';
        return;
      }
      el.innerHTML = 'Next refresh in <strong id="refreshSeconds">' + secondsLeft + '</strong>s';
    }

    function resetRefreshTimer() {
      secondsLeft = REFRESH_SEC;
      updateRefreshTimer();
    }

    function showLoadToast(message) {
      const toast = $('loadToast');
      toast.textContent = message;
      show(toast, true);
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => show(toast, false), 300);
      }, 3500);
    }

    function startRefreshClock() {
      setInterval(() => {
        if (isLoading) return;
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          loadSummary(true);
          return;
        }
        updateRefreshTimer();
      }, 1000);
    }

    async function loadSummary(isAutoRefresh = false) {
      if (isLoading) return;
      isLoading = true;
      if (!isAutoRefresh) setError('');
      if (!isAutoRefresh) $('loadBtn').disabled = true;
      setConn('busy', isAutoRefresh ? 'Refreshing…' : 'Loading…');
      updateRefreshTimer();

      try {
        const origin = apiOrigin();
        const { json } = await fetchSummaryFrom(origin);
        lastResponse = json;
        renderDashboard(json);
        const time = new Date().toLocaleTimeString();
        setConn('ok', 'Last updated ' + time);
        showLoadToast((isAutoRefresh ? 'Data reloaded' : 'Data loaded') + ' at ' + time);
        resetRefreshTimer();
      } catch (err) {
        setConn('err', isAutoRefresh ? 'Refresh failed' : 'Failed');
        let msg = err.message || String(err);
        if (msg === 'STATIC_404') {
          msg = 'You started python -m http.server — that cannot proxy /api.\n\n'
            + 'Close that terminal (Ctrl+C), then double-click start.bat in this folder.\n'
            + 'start.bat will open http://localhost:8080 automatically.';
        } else if (msg === 'Failed to fetch') {
          msg = 'Cannot reach API.\n\n'
            + '1. .NET backend must run on http://localhost:5036\n'
            + '2. Double-click start.bat (not python -m http.server)\n'
            + '3. Leave Base URL empty';
        }
        if (!isAutoRefresh) {
          setError(msg);
          show($('dashboard'), false);
        } else {
          resetRefreshTimer();
        }
      } finally {
        isLoading = false;
        if (!isAutoRefresh) $('loadBtn').disabled = false;
        updateRefreshTimer();
      }
    }

    $('loadBtn').addEventListener('click', () => {
      resetRefreshTimer();
      loadSummary(false);
    });
    $('toggleJsonBtn').addEventListener('click', () => {
      const visible = !$('jsonCard').classList.contains('hidden');
      show($('jsonCard'), !visible);
      $('toggleJsonBtn').textContent = visible ? 'Show JSON' : 'Hide JSON';
    });

    startRefreshClock();
    loadSummary(false);
  </script>
</body>
</html>
